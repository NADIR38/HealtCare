<!DOCTYPE html>
<html>
<head>
    <title>SignalR Notification Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        .notification {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #3b82f6;
            background: #eff6ff;
        }

            .notification.success {
                border-color: #10b981;
                background: #f0fdf4;
            }

            .notification.error {
                border-color: #ef4444;
                background: #fef2f2;
            }

            .notification.warning {
                border-color: #f59e0b;
                background: #fffbeb;
            }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #notifications {
            max-height: 400px;
            overflow-y: auto;
        }

        .status {
            padding: 10px;
            margin: 10px 0;
            background: #f3f4f6;
            border-radius: 5px;
        }

        .connected {
            color: #10b981;
        }

        .disconnected {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <h1>🔔 SignalR Notification Test</h1>

    <div class="status">
        Connection Status: <span id="status" class="disconnected">Disconnected</span>
    </div>

    <div>
        <h3>Authentication</h3>
        <input type="text" id="token" placeholder="Enter JWT Token" style="width: 500px;" />
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
    </div>

    <div>
        <h3>Send Test Notification (via API)</h3>
        <input type="text" id="userId" placeholder="User ID (GUID)" style="width: 300px;" />
        <input type="text" id="title" placeholder="Title" />
        <input type="text" id="message" placeholder="Message" style="width: 300px;" />
        <button onclick="sendTestNotification()">Send Notification</button>
    </div>

    <h3>Received Notifications</h3>
    <div id="notifications"></div>

    <script>
        let connection = null;
        let token = null;

        async function connect() {
            token = document.getElementById('token').value;

            if (!token) {
                alert('Please enter a JWT token');
                return;
            }

            connection = new signalR.HubConnectionBuilder()
                .withUrl("https://localhost:7227/notificationHub", { 
                    accessTokenFactory: () => token
                })
                .withAutomaticReconnect()
                .build();

            connection.on("ReceiveNotification", (notification) => {
                displayNotification(notification);
            });

            connection.onclose(() => {
                updateStatus(false);
            });

            connection.onreconnecting(() => {
                updateStatus(false);
                console.log("Reconnecting...");
            });

            connection.onreconnected(() => {
                updateStatus(true);
                console.log("Reconnected!");
            });

            try {
                await connection.start();
                updateStatus(true);
                console.log("SignalR Connected!");
            } catch (err) {
                console.error("Connection failed: ", err);
                alert("Connection failed! Check console for details.");
            }
        }

        async function disconnect() {
            if (connection) {
                await connection.stop();
                updateStatus(false);
                console.log("Disconnected");
            }
        }

        function updateStatus(isConnected) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = isConnected ? 'Connected' : 'Disconnected';
            statusEl.className = isConnected ? 'connected' : 'disconnected';
        }

        function displayNotification(notification) {
            const notificationsDiv = document.getElementById('notifications');
            const notifEl = document.createElement('div');
            notifEl.className = 'notification';

            const typeClass = notification.type.includes('Completed') || notification.type.includes('Approved') ? 'success' :
                             notification.type.includes('Cancelled') || notification.type.includes('Rejected') ? 'error' :
                             notification.type.includes('Reminder') ? 'warning' : '';

            if (typeClass) notifEl.className += ' ' + typeClass;

            notifEl.innerHTML = `
                <strong>${notification.title}</strong><br>
                ${notification.message}<br>
                <small>Type: ${notification.type} | ${new Date(notification.createdAt).toLocaleString()}</small>
            `;

            notificationsDiv.insertBefore(notifEl, notificationsDiv.firstChild);
        }

        async function sendTestNotification() {
            const userId = document.getElementById('userId').value;
            const title = document.getElementById('title').value;
            const message = document.getElementById('message').value;

            if (!userId || !title || !message) {
                alert('Please fill all fields');
                return;
            }

            if (!token) {
                alert('Please connect first');
                return;
            }

            try {
                const response = await fetch('https://localhost:7227/api/notifications/test', { // Replace 7xxx
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        userId: userId,
                        type: 'GeneralNotification',
                        title: title,
                        message: message,
                        actionUrl: null,
                        relatedEntityId: null
                    })
                });

                if (response.ok) {
                    alert('Test notification sent!');
                } else {
                    alert('Failed to send notification');
                }
            } catch (err) {
                console.error('Error:', err);
                alert('Error sending notification');
            }
        }
    </script>
</body>
</html>
